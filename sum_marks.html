<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sum of Three Marks</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 420px;
            margin: 40px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #f9f9f9;
        }

        label,
        input,
        button {
            display: block;
            width: 100%;
            margin-bottom: 12px;
        }

        input {
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background: #005f99;
        }

        #result {
            margin-top: 18px;
            font-size: 1.15rem;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Calculate Total Marks</h1>
    <p>Enter marks for three subjects and click <strong>Calculate</strong>.</p>

    <label for="mark1">Subject 1:</label>
    <input type="number" id="mark1" placeholder="Enter mark" min="0" />

    <label for="mark2">Subject 2:</label>
    <input type="number" id="mark2" placeholder="Enter mark" min="0" />

    <label for="mark3">Subject 3:</label>
    <input type="number" id="mark3" placeholder="Enter mark" min="0" />

    <button id="calculateBtn">Calculate Sum</button>
    <div id="result"></div>

    <script>
        const mark1 = document.getElementById('mark1');
        const mark2 = document.getElementById('mark2');
        const mark3 = document.getElementById('mark3');
        const result = document.getElementById('result');
        const button = document.getElementById('calculateBtn');

        button.addEventListener('click', () => {
            const value1 = Number(mark1.value);
            const value2 = Number(mark2.value);
            const value3 = Number(mark3.value);

            const sum = value1 + value2 + value3;
            result.textContent = `Sum of three marks: ${sum}`;
            result.style.color = '#006400';
        });
    </script>
</body>

</html>
