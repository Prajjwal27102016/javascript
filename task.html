<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: lightblue;
        }
        h3 {
            color: rgba(64, 225, 16, 0.671);
        }
        input {
            padding: 5px;
            border: 2px solid black;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: rgb(2, 40, 255);
            color: rgb(29, 255, 247);
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    
        <h3>enter subject marks</h3>
    
        maths: <input type="number" id="p1"><br><br>
        science: <input type="number" id="p2"><br><br>
        geography: <input type="number" id="p3"><br><br>
    
        <button onclick="calculate()">Calculate Average</button>
    
        <p id="id1"><b></b></p>
    
        <script>
            function calculate() {

                var n1 = Number(document.getElementById('p1').value);
                var n2 = Number(document.getElementById('p2').value);
                var n3 = Number(document.getElementById('p3').value);


                var total = (n1 + n2 + n3) / 3;


                document.getElementById('id1').innerHTML = "the average is " + total;
            }
        </script>
 
</body>
</html>
